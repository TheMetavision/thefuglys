[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# These two functions require() ES modules the Astro pages and browser code also
# import: src/lib/artwork-pricing.mjs and src/lib/ga4-item.mjs (the webhook
# reaches ga4-item through ga4-purchase.cjs). esbuild bundles them into each
# function at build time, so the deployed function does not depend on the
# runtime's require(esm).
[functions."create-checkout"]
  node_bundler = "esbuild"

[functions."stripe-webhook"]
  node_bundler = "esbuild"

# Printful mockups are served through Netlify Image CDN (/.netlify/images?url=…),
# so visitors load them from thefuglys.com, resized, and never contact printful.com.
[images]
  remote_images = ['https://files\.cdn\.printful\.com/.*']

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Short URLs for the legal pages (they live under /legal/ in Sanity)
[[redirects]]
  from = "/privacy-policy"
  to = "/legal/privacy-policy/"
  status = 301

[[redirects]]
  from = "/cookie-policy"
  to = "/legal/cookie-policy/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing on the site uses the camera or microphone.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    # Google Analytics (loaded only after cookie consent): googletagmanager.com, *.google-analytics.com, *.analytics.google.com.
    # Report-only for now: violations appear in the browser console; nothing is blocked.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; connect-src 'self' https://cdn.sanity.io https://*.api.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://cdn.sanity.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
