[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# These two functions require() ES modules the Astro pages and browser code also
# import: src/lib/artwork-pricing.mjs and src/lib/ga4-item.mjs (the webhook
# reaches ga4-item through ga4-purchase.cjs). esbuild bundles them into each
# function at build time, so the deployed function does not depend on the
# runtime's require(esm).
[functions."create-checkout"]
  node_bundler = "esbuild"

[functions."stripe-webhook"]
  node_bundler = "esbuild"

# Printful mockups are served through Netlify Image CDN (/.netlify/images?url=…),
# so visitors load them from thefuglys.com, resized, and never contact printful.com.
[images]
  remote_images = ['https://files\.cdn\.printful\.com/.*']

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Short URLs for the legal pages (they live under /legal/ in Sanity)
[[redirects]]
  from = "/privacy-policy"
  to = "/legal/privacy-policy/"
  status = 301

[[redirects]]
  from = "/cookie-policy"
  to = "/legal/cookie-policy/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing on the site uses the camera or microphone.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    # Google Analytics (loaded only after cookie consent): googletagmanager.com, *.google-analytics.com, *.analytics.google.com.
    # Report-only for now: violations appear in the browser console; nothing is blocked.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; connect-src 'self' https://cdn.sanity.io https://*.api.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://cdn.sanity.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Junkyard Racers (public/games/junkyard-racers/): a static full-screen game page.
# The game's GLTFLoader decodes kart textures with fetch() on blob: URLs, which
# the site-wide connect-src does not list (a report-only violation per texture).
# Same policy as /* plus blob: in connect-src, for the game's path only.
[[headers]]
  for = "/games/junkyard-racers/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; connect-src 'self' blob: https://cdn.sanity.io https://*.api.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://cdn.sanity.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Assets keep their filenames between releases (no content hash), so a week's
# cache rather than "immutable"; index.html, game.js and game.css keep Netlify's
# default (max-age=0, must-revalidate) so a new release is picked up at once.
[[headers]]
  for = "/games/junkyard-racers/models/*"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/junkyard-racers/tex/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/junkyard-racers/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/junkyard-racers/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Scrap Dash (public/games/scrap-dash/): the same rules as Junkyard Racers above.
# Its GLTFLoader also fetches textures from blob: URLs; the page calls the
# leaderboard (/api/sd-*, same origin, already allowed by connect-src 'self')
# and uses crypto.subtle (needs no CSP change). Its meshopt decoder compiles
# WebAssembly, so script-src here also has 'wasm-unsafe-eval' (WebAssembly only,
# not eval()).
[[headers]]
  for = "/games/scrap-dash/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; connect-src 'self' blob: https://cdn.sanity.io https://*.api.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://cdn.sanity.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/games/scrap-dash/models/*"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/scrap-dash/tex/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/scrap-dash/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/scrap-dash/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
