[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Short URLs for the legal pages (they live under /legal/ in Sanity)
[[redirects]]
  from = "/privacy-policy"
  to = "/legal/privacy-policy"
  status = 301

[[redirects]]
  from = "/cookie-policy"
  to = "/legal/cookie-policy"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
